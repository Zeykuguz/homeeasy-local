name: iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test protocol package
        working-directory: ios/HomeEasyKit
        run: swift test

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild -project HomeEasy.xcodeproj -scheme HomeEasy -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HomeEasy.app Payload/
          zip -qry HomeEasyLocal.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HomeEasyLocal-ipa
          path: ios/HomeEasyLocal.ipa
